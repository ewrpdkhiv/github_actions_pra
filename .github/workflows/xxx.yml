name: 打包React項目

on: push

jobs:
  pnpm-build:
    runs-on: ubuntu-latest
    steps:
      - name: 不明的動作
        uses: actions/checkout@v6

      - name: 設定pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      #     install: false

      # - name: 手動安裝
      #   run: pnpm install

      - name: 檢查 pnpm 版本
        run: pnpm --version

      - name: 編譯
        run: pnpm build
